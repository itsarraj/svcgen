[package]
name = "svcgen"
version = "0.1.0"
edition = "2021"
description = "Generates a systemd unit file with sane defaults, and validates an existing one for common mistakes"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/svcgen"
readme = "README.md"
keywords = ["systemd", "unit-file", "deploy", "linux", "generator"]
categories = ["command-line-utilities"]

[lib]
name = "svcgen"
path = "src/lib.rs"

[[bin]]
name = "svcgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
